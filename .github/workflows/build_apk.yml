name: Build APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Generate app icon from logo
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert logo.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restore AndroidManifest with proper icon
        run: |
          sed -i 's|@android:mipmap/sym_def_app_icon|@mipmap/ic_launcher|' app/src/main/AndroidManifest.xml

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore app/qris-sender.keystore \
            -alias qris-sender \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass qrissender2024 \
            -keypass qrissender2024 \
            -dname "CN=QRIS Sender, OU=Dev, O=QRIS, L=Jakarta, S=Indonesia, C=ID"

      - name: Build Release APK
        run: |
          export KEYSTORE_PATH=$(realpath app/qris-sender.keystore)
          cat > app/build.gradle << 'SIGNING'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.qrissender'
              compileSdk 34

              defaultConfig {
                  applicationId "com.qrissender"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_PATH') ?: 'qris-sender.keystore')
                      storePassword 'qrissender2024'
                      keyAlias 'qris-sender'
                      keyPassword 'qrissender2024'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          SIGNING
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qris-sender-apk
          path: app/build/outputs/apk/release/app-release.apk
